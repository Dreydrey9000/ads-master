<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Ads Master local workspace architecture</title><desc id="desc">CSV validation feeds the glass workspace and browser storage. Explicit sample mode is separate. The original Convex and provider integrations are unfinished and not enabled.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#a0e5c9"/></marker></defs><rect width="1000" height="390" rx="20" fill="#0c1419"/><g font-family="sans-serif" font-size="16" fill="#edf3f0"><text x="36" y="42" font-size="22">Ads Master · Local workspace</text><g fill="#20322c" stroke="#728f80"><rect x="35" y="100" width="185" height="65" rx="12"/><rect x="300" y="100" width="190" height="65" rx="12"/><rect x="570" y="100" width="175" height="65" rx="12"/><rect x="800" y="100" width="165" height="65" rx="12"/><rect x="300" y="225" width="190" height="70" rx="12"/><rect x="570" y="225" width="175" height="70" rx="12"/></g><text x="62" y="128">Local CSV file</text><text x="62" y="150" font-size="12">Validate and aggregate</text><text x="325" y="137">Glass workspace</text><text x="586" y="137">Browser storage</text><text x="824" y="137">CSV export</text><text x="325" y="254">Sample mode</text><text x="325" y="277" font-size="12">Illustrative data only</text><text x="590" y="254">Convex scaffold</text><text x="590" y="277" font-size="12">Not enabled</text><text x="35" y="350" fill="#a4b6b0" font-size="14">Provider sync requires authentication, account ownership checks, and verified adapters. No ad writes.</text></g><g fill="none" stroke="#a0e5c9" stroke-width="2" marker-end="url(#arrow)"><path d="M220 132 H295"/><path d="M495 132 H564" marker-start="url(#arrow)"/><path d="M745 132 H794"/><path d="M395 225 V170"/><path d="M490 157 L570 245" stroke-dasharray="5 7"/></g></svg>
