<title id="title">Ads Master architecture</title><desc id="desc">GitHub deploys the Next.js workspace to Vercel. CSV imports stay in browser storage. Google sign-in uses Convex Auth. A private server endpoint verifies the owner and reads OpenAI, Meta and Google Ads with server-only credentials. Original Convex ad functions remain disabled.</desc>
